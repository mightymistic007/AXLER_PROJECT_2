networks:
  icestream-net:
    driver: bridge

services:
  # Redpanda: Drop-in Apache Kafka compatible broker
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: icestream-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "29092:29092"
    networks:
      - icestream-net

  # MinIO: S3-compatible Lakehouse Storage Engine
  minio:
    image: quay.io/minio/minio:latest
    container_name: icestream-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - icestream-net